<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuario</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Administrador</a>
            <a href="productos.html">Productos</a>
            <a href="usuarios.html">Usuarios</a>
        </nav>
    </header>

    <main>
        <h1>Usuario</h1>
        <form id="form-admin-usuario" novalidate>
            <label>
                RUN
                <input name="run" required>
                <small class="error"></small>
            </label>
            <label>
                Nombre
                <input name="nombre" maxlength="50" required>
                <small class="error"></small>
            </label>
            <label>
                Apellidos
                <input name="apellidos" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Correo
                <input name="correo" type="email" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Fecha de nacimiento
                <input name="fecha" type="date">
                <small class="error"></small>
            </label>
            <label>
                Dirección
                <input name="direccion" maxlength="300" required>
                <small class="error"></small>
            </label>
            <label>
                Región
                <select id="region" name="region" required></select>
                <small class="error"></small>
            </label>
            <label>
                Comuna
                <select id="comuna" name="comuna" required></select>
                <small class="error"></small>
            </label>
            <label>
                Tipo de usuario
                <select name="tipo" required>
                    <option value="Administrador">Administrador</option>
                    <option value="Cliente">Cliente</option>
                    <option value="Vendedor">Vendedor</option>
                </select>
                <small class="error"></small>
            </label>
            <p id="mensaje-admin-usuario" class="mensaje" aria-live="polite"></p>
            <button type="submit">Guardar</button>
        </form>
    </main>

    <footer>
        <p>HuertoHogar - Proyecto DSY1104</p>
    </footer>

    <script src="../assets/js/regiones.js"></script>
    <script src="../assets/js/validaciones.js"></script>
    <script src="../assets/js/usuarios.js"></script>
</body>
</html>
