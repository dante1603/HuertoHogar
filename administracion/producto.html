<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Administrador</a>
            <a href="productos.html">Productos</a>
            <a href="usuarios.html">Usuarios</a>
        </nav>
    </header>

    <main>
        <h1>Producto</h1>
        <form id="form-producto" novalidate>
            <label>
                Código
                <input name="codigo" required>
                <small class="error"></small>
            </label>
            <label>
                Nombre
                <input name="nombre" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Descripción
                <textarea name="descripcion" maxlength="500"></textarea>
                <small class="error"></small>
            </label>
            <label>
                Precio
                <input id="precio" name="precio" type="number" min="0" step="0.01" required>
                <small class="error"></small>
            </label>
            <label>
                Stock
                <input id="stock" name="stock" type="number" min="0" step="1" required>
                <small class="error"></small>
            </label>
            <label>
                Stock crítico
                <input id="stock-critico" name="stockCritico" type="number" min="0" step="1">
                <small class="error"></small>
            </label>
            <p id="mensaje-stock" class="mensaje" aria-live="polite"></p>
            <label>
                Categoría
                <select name="categoria" required>
                    <option value="">Seleccionar</option>
                    <option value="Frutas">Frutas</option>
                    <option value="Verduras">Verduras</option>
                    <option value="Productos Orgánicos">Productos Orgánicos</option>
                    <option value="Lácteos">Lácteos</option>
                </select>
                <small class="error"></small>
            </label>
            <label>
                Imagen
                <input name="imagen" type="file" accept="image/*">
                <small class="error"></small>
            </label>
            <button type="submit">Guardar</button>
        </form>
    </main>

    <footer>
        <p>HuertoHogar</p>
    </footer>

    <script src="../assets/js/validaciones.js"></script>
</body>
</html>
