    <main>
        <h1>Iniciar sesión</h1>
        <form id="form-login" novalidate>
            <label>
                Correo
                <input name="correo" type="email" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Contraseña
                <input name="contrasena" type="password" minlength="4" maxlength="10" required>
                <small class="error"></small>
            </label>
            <p id="mensaje-login" class="mensaje" aria-live="polite"></p>
            <button type="submit">Ingresar</button>
        </form>
        <a href="registro.html">Crear una cuenta</a>
    </main>
