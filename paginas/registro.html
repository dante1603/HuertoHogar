<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HuertoHogar</a>
            <a href="../index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main>
        <h1>Registro</h1>
        <form id="form-registro" novalidate>
            <label>
                RUN
                <input name="run" required>
                <small class="error"></small>
            </label>
            <label>
                Nombre
                <input name="nombre" maxlength="50" required>
                <small class="error"></small>
            </label>
            <label>
                Apellidos
                <input name="apellidos" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Correo
                <input name="correo" type="email" maxlength="100" required>
                <small class="error"></small>
            </label>
            <label>
                Fecha de nacimiento
                <input name="fecha" type="date">
                <small class="error"></small>
            </label>
            <label>
                Dirección
                <input name="direccion" maxlength="300" required>
                <small class="error"></small>
            </label>
            <label>
                Región
                <select id="region" name="region" required></select>
                <small class="error"></small>
            </label>
            <label>
                Comuna
                <select id="comuna" name="comuna" required></select>
                <small class="error"></small>
            </label>
            <label>
                Contraseña
                <input name="contrasena" type="password" minlength="4" maxlength="10" required>
                <small class="error"></small>
            </label>
            <p id="mensaje-registro" class="mensaje" aria-live="polite"></p>
            <button type="submit">Registrarse</button>
        </form>
    </main>

    <footer>
        <p>HuertoHogar - Proyecto DSY1104</p>
        <a href="contacto.html">Contacto</a>
    </footer>

    <script src="../assets/js/regiones.js"></script>
    <script src="../assets/js/validaciones.js"></script>
    <script src="../assets/js/usuarios.js"></script>
</body>
</html>
